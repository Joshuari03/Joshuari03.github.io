<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>Erasmus Budget Tracker</title>
        <style>
            body {
                font-family: -apple-system, sans-serif;
                background: #f4f7f6;
                padding: 20px;
                color: #333;
                margin: 0;
                padding-top: 20px;
                padding-bottom: 40px;
            }
            .card {
                background: white;
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
                margin-bottom: 20px;
            }
            h1,
            h2 {
                font-size: 1.2rem;
                margin-top: 0;
                color: #2c3e50;
            }
            .stat {
                font-size: 1.8rem;
                font-weight: bold;
                color: #2c3e50;
            }
            .label {
                font-size: 0.8rem;
                color: #7f8c8d;
                text-transform: uppercase;
                font-weight: bold;
                display: block;
                margin-bottom: 5px;
            }
            input,
            select,
            button {
                width: 100%;
                padding: 12px;
                margin: 8px 0 15px 0;
                border-radius: 8px;
                border: 1px solid #ddd;
                box-sizing: border-box;
                font-size: 16px;
            }
            button {
                background: #3498db;
                color: white;
                border: none;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.3s;
            }
            button:hover {
                background: #2980b9;
            }
            button.setup-btn {
                background: #2c3e50;
                margin-bottom: 0;
            }
            button.setup-btn:hover {
                background: #1a252f;
            }
            .extra-budget {
                color: #27ae60;
            }
            .warning {
                color: #e74c3c;
            }
            .note {
                font-size: 0.8rem;
                color: #e67e22;
                margin-top: 5px;
                display: block;
            }

            /* Stili per la cronologia */
            .history-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .history-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px solid #eee;
            }
            .history-item:last-child {
                border-bottom: none;
            }
            .history-details {
                display: flex;
                flex-direction: column;
            }
            .history-amount {
                font-weight: bold;
                font-size: 1.1rem;
                color: #2c3e50;
            }
            .history-cat {
                font-size: 0.85rem;
                color: #7f8c8d;
                text-transform: capitalize;
            }
            .history-date {
                font-size: 0.75rem;
                color: #bdc3c7;
            }
            .delete-btn {
                width: auto;
                padding: 8px 12px;
                margin: 0;
                background: #e74c3c;
                color: white;
                border-radius: 6px;
                font-size: 0.9rem;
            }
            .delete-btn:hover {
                background: #c0392b;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Impostazioni Budget</h2>
            <span class="label">Budget Totale / Rimanente (€):</span>
            <input
                type="number"
                id="setupBudget"
                placeholder="Es. 3500"
                inputmode="decimal"
            />
            <span class="label">Data fine Erasmus:</span>
            <input type="date" id="setupDate" />
            <button class="setup-btn" onclick="saveSettings()">
                Salva / Modifica Impostazioni
            </button>
        </div>

        <div class="card">
            <span class="label">Margine Sicuro per Extra</span>
            <div id="extraMargin" class="stat extra-budget">€ 0.00</div>
            <span class="note"
                >*Include +20% di sovrastima sulle spese quotidiane
                calcolate.</span
            >

            <div
                style="
                    display: flex;
                    justify-content: space-between;
                    margin-top: 20px;
                "
            >
                <div>
                    <span class="label">Fondo Attuale</span>
                    <div
                        id="budgetLeft"
                        style="font-size: 1.2rem; font-weight: bold"
                    >
                        € 0
                    </div>
                </div>
                <div style="text-align: right">
                    <span class="label">Giorni alla fine</span>
                    <div
                        id="daysLeft"
                        style="font-size: 1.2rem; font-weight: bold"
                    >
                        -
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h1>Aggiungi Spesa</h1>
            <input
                type="number"
                id="amount"
                placeholder="Importo (€)"
                inputmode="decimal"
            />
            <select id="category">
                <option value="cibo">
                    Cibo / Spesa Quotidiana (Variabile)
                </option>
                <option value="extra">Viaggi / Vestiti / Svago (Extra)</option>
                <option value="fisso">Affitto / Utenze (Spesa Fissa)</option>
            </select>
            <button onclick="addExpense()">Registra Spesa</button>
        </div>

        <div class="card">
            <h2>Storico Spese</h2>
            <ul id="historyContainer" class="history-list"></ul>
        </div>

        <script>
            const MARGINE_SICUREZZA = 1.2; // +20% di sovrastima sulle spese variabili

            // Carica dati dal LocalStorage
            let expenses =
                JSON.parse(localStorage.getItem("erasmus_expenses")) || [];
            let settings = JSON.parse(
                localStorage.getItem("erasmus_settings"),
            ) || { budget: 0, endDate: null };

            // Popola i campi all'avvio
            if (settings.budget)
                document.getElementById("setupBudget").value = settings.budget;
            if (settings.endDate)
                document.getElementById("setupDate").value = settings.endDate;

            function saveSettings() {
                const budget = parseFloat(
                    document.getElementById("setupBudget").value,
                );
                const endDate = document.getElementById("setupDate").value;

                if (!budget || !endDate) {
                    alert("Inserisci sia il budget che la data di fine.");
                    return;
                }

                settings = { budget, endDate };
                localStorage.setItem(
                    "erasmus_settings",
                    JSON.stringify(settings),
                );
                calculate();
                alert("Impostazioni aggiornate con successo!");
            }

            function addExpense() {
                if (!settings.budget || !settings.endDate) {
                    alert("Prima salva le impostazioni del budget in alto!");
                    return;
                }

                const amount = parseFloat(
                    document.getElementById("amount").value,
                );
                const category = document.getElementById("category").value;
                if (!amount || amount <= 0) return;

                const newExpense = {
                    amount: amount,
                    category: category,
                    date: new Date().toISOString(),
                };

                expenses.push(newExpense);
                localStorage.setItem(
                    "erasmus_expenses",
                    JSON.stringify(expenses),
                );

                document.getElementById("amount").value = ""; // Pulisce il campo
                calculate();
            }

            function deleteExpense(index) {
                if (confirm("Sei sicuro di voler eliminare questa spesa?")) {
                    expenses.splice(index, 1); // Rimuove l'elemento all'indice specifico
                    localStorage.setItem(
                        "erasmus_expenses",
                        JSON.stringify(expenses),
                    );
                    calculate();
                }
            }

            function renderHistory() {
                const container = document.getElementById("historyContainer");
                container.innerHTML = ""; // Svuota la lista

                if (expenses.length === 0) {
                    container.innerHTML =
                        '<li style="color: #999; font-size: 0.9rem;">Nessuna spesa registrata.</li>';
                    return;
                }

                // Mostriamo l'array dall'ultimo inserito (più recente) al primo
                for (let i = expenses.length - 1; i >= 0; i--) {
                    const e = expenses[i];
                    const dateObj = new Date(e.date);
                    const dateString =
                        dateObj.toLocaleDateString("it-IT") +
                        " " +
                        dateObj.toLocaleTimeString("it-IT", {
                            hour: "2-digit",
                            minute: "2-digit",
                        });

                    const li = document.createElement("li");
                    li.className = "history-item";
                    li.innerHTML = `
                    <div class="history-details">
                        <span class="history-amount">€ ${e.amount.toFixed(2)}</span>
                        <span class="history-cat">${e.category}</span>
                        <span class="history-date">${dateString}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteExpense(${i})">
                        <i class="fas fa-trash"></i> X
                    </button>
                `;
                    container.appendChild(li);
                }
            }

            function calculate() {
                renderHistory(); // Aggiorna sempre la vista della cronologia

                if (!settings.budget || !settings.endDate) return;

                const oggi = new Date();
                const dataFine = new Date(settings.endDate);

                let primaSpesaData =
                    expenses.length > 0 ? new Date(expenses[0].date) : oggi;

                // Per evitare divisioni per 0, consideriamo almeno 1 giorno trascorso
                const giorniTrascorsi = Math.max(
                    1,
                    (oggi - primaSpesaData) / (1000 * 60 * 60 * 24),
                );
                // I giorni rimanenti non possono essere negativi
                const giorniMancanti = Math.max(
                    0,
                    (dataFine - oggi) / (1000 * 60 * 60 * 24),
                );

                let totalFissi = 0,
                    totalCibo = 0,
                    totalExtraUsati = 0;

                expenses.forEach((e) => {
                    if (e.category === "fisso") totalFissi += e.amount;
                    if (e.category === "cibo") totalCibo += e.amount;
                    if (e.category === "extra") totalExtraUsati += e.amount;
                });

                // Logica del Margine
                const mediaCiboReale = totalCibo / giorniTrascorsi;
                const proiezioneCiboPrudente =
                    mediaCiboReale * MARGINE_SICUREZZA * giorniMancanti;

                const budgetRimanente =
                    settings.budget - totalFissi - totalCibo - totalExtraUsati;
                const marginePerExtra =
                    budgetRimanente - proiezioneCiboPrudente;

                // Aggiornamento Interfaccia
                const marginEl = document.getElementById("extraMargin");
                marginEl.innerText = `€ ${marginePerExtra.toFixed(2)}`;
                marginEl.className =
                    marginePerExtra >= 0 ? "stat extra-budget" : "stat warning";

                document.getElementById("budgetLeft").innerText =
                    `€ ${budgetRimanente.toFixed(2)}`;
                document.getElementById("daysLeft").innerText =
                    Math.ceil(giorniMancanti);
            }

            // Calcola e renderizza i dati all'avvio della pagina
            calculate();
        </script>
    </body>
</html>
