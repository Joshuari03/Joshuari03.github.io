<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flashcards - Joshuari</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            /* --- LAYOUT GENERALE --- */
            .flashcard-section {
                padding: 40px 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 80vh; /* Occupa buona parte dello schermo */
                font-family: sans-serif;
            }

            /* --- CONTENITORE PROSPETTIVA (SCENA) --- */
            .scene {
                width: 90%;
                max-width: 400px;
                height: 300px;
                margin: 20px auto;
                perspective: 1000px; /* Dà profondità al 3D */
                display: none; /* Nascosto finché non carichi il file */
            }

            /* --- LA CARD STESSA --- */
            .card {
                width: 100%;
                height: 100%;
                position: relative;
                transition: transform 0.6s;
                transform-style: preserve-3d;
                cursor: pointer;
            }

            /* Classe aggiunta via JS per girare la card */
            .card.is-flipped {
                transform: rotateY(180deg);
            }

            /* --- FACCE DELLA CARD (FRONTE E RETRO) --- */
            .card-face {
                position: absolute;
                width: 100%;
                height: 100%;
                -webkit-backface-visibility: hidden; /* Nasconde il retro quando non girata */
                backface-visibility: hidden;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                border: 2px solid #eee;
                background-color: white !important; /* Forza sfondo bianco */

                /* Centratura del testo */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 20px;
                box-sizing: border-box;
            }

            /* Faccia Anteriore (Cinese + Pinyin) */
            .card-front {
                background-color: white;
            }

            /* Faccia Posteriore (Traduzione) */
            .card-back {
                background-color: white;
                transform: rotateY(180deg); /* È già girata all'inizio */
            }

            /* --- STILI TESTO (Forzati neri/visibili) --- */
            .hanzi {
                font-size: 4.5rem;
                color: black !important; /* Nero assoluto */
                font-weight: bold;
                margin-bottom: 15px;
            }

            .pinyin {
                font-size: 1.8rem;
                color: #0066cc !important; /* Blu per distinzione, ma ben visibile */
                visibility: hidden; /* Nascosto all'inizio */
                font-weight: 500;
            }

            .translation {
                font-size: 2rem;
                color: black !important; /* Nero assoluto */
                font-weight: bold;
            }

            /* --- CONTROLLI --- */
            .controls-area {
                display: none; /* Nascosta all'inizio */
                flex-direction: column;
                gap: 15px;
                margin-top: 20px;
                align-items: center;
            }

            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                cursor: pointer;
                transition: background 0.2s;
                width: 200px;
            }

            .btn-pinyin {
                background-color: #e0e0e0;
                color: #333;
                border: 1px solid #ccc;
            }
            .btn-pinyin:hover {
                background-color: #d0d0d0;
            }

            .btn-next {
                background-color: #333;
                color: white;
            }
            .btn-next:hover {
                background-color: #555;
            }

            #file-input {
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container">
                <h1>Joshuari</h1>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="flashcards.html">Flashcards</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <section class="flashcard-section">
            <div class="container" style="text-align: center">
                <h2>Ripasso Cinese</h2>
                <p id="instruction-text">
                    Carica il tuo mazzo JSON per iniziare.
                </p>

                <input type="file" id="file-input" accept=".json" />

                <div class="scene" id="scene">
                    <div class="card" id="card">
                        <div class="card-face card-front">
                            <div class="hanzi" id="hanzi"></div>
                            <div class="pinyin" id="pinyin"></div>
                        </div>

                        <div class="card-face card-back">
                            <div class="translation" id="translation"></div>
                        </div>
                    </div>
                </div>

                <div class="controls-area" id="controls">
                    <button class="btn btn-pinyin" id="show-pinyin-btn">
                        Mostra Pinyin
                    </button>
                    <button class="btn btn-next" id="next-btn">
                        Prossima Parola
                    </button>
                </div>
            </div>
        </section>

        <footer>
            <div class="container">
                <p>&copy; 2024 Joshuari</p>
            </div>
        </footer>

        <script>
            let deck = [];
            let currentIndex = 0;

            // Elementi DOM
            const fileInput = document.getElementById("file-input");
            const scene = document.getElementById("scene");
            const card = document.getElementById("card");
            const controls = document.getElementById("controls");
            const instructionText = document.getElementById("instruction-text");

            // Elementi Testo
            const hanziEl = document.getElementById("hanzi");
            const pinyinEl = document.getElementById("pinyin");
            const translationEl = document.getElementById("translation");

            // Pulsanti
            const pinyinBtn = document.getElementById("show-pinyin-btn");
            const nextBtn = document.getElementById("next-btn");

            // 1. CARICAMENTO FILE
            fileInput.addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (event) {
                    try {
                        deck = JSON.parse(event.target.result);
                        if (deck.length > 0) {
                            deck.sort(() => Math.random() - 0.5); // Mischia
                            currentIndex = 0;
                            loadCardData();

                            // Mostra interfaccia
                            fileInput.style.display = "none";
                            instructionText.style.display = "none";
                            scene.style.display = "block";
                            controls.style.display = "flex";
                        }
                    } catch (err) {
                        alert("Errore nel file JSON.");
                    }
                };
                reader.readAsText(file);
            });

            // 2. FUNZIONE PER CARICARE I DATI
            function loadCardData() {
                const data = deck[currentIndex];

                // Resetta lo stato visivo
                card.classList.remove("is-flipped"); // Torna sul fronte
                pinyinEl.style.visibility = "hidden"; // Nascondi pinyin

                // Imposta i testi con un piccolo ritardo per evitare spoiler mentre gira
                setTimeout(() => {
                    hanziEl.textContent = data.carattere;
                    pinyinEl.textContent = data.pinyin;
                    translationEl.textContent = data.traduzione;
                }, 200);
            }

            // 3. EVENTO: MOSTRA PINYIN (Bottone Grigio)
            pinyinBtn.addEventListener("click", (e) => {
                e.stopPropagation(); // Evita che il click passi alla card
                pinyinEl.style.visibility = "visible";
            });

            // 4. EVENTO: GIRA LA CARD (Click sulla Card)
            card.addEventListener("click", () => {
                card.classList.toggle("is-flipped");
            });

            // 5. EVENTO: PROSSIMA PAROLA (Bottone Nero)
            nextBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                currentIndex = (currentIndex + 1) % deck.length;
                if (currentIndex === 0) deck.sort(() => Math.random() - 0.5); // Rimischia se finito
                loadCardData();
            });
        </script>
    </body>
</html>
